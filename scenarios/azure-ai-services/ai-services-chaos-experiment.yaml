# Azure AI Services Chaos Experiment Configuration
# Tests AI services resilience, API availability, and model performance under failure conditions

apiVersion: chaosstudio.io/v1beta1
kind: Experiment
metadata:
  name: ai-services-chaos-experiment
  namespace: chaos-testing
spec:
  steps:
    - name: ai-services-api-throttling
      type: AIServicesAPIThrottling
      duration: "PT3M"
      parameters:
        targetResourceType: "Microsoft.CognitiveServices/accounts"
        targetResources:
          - ""  # AI Services Account Resource ID
        throttlingType: "rate_limit_exceeded"
        
    - name: ai-services-model-deployment-failure
      type: AIServicesModelDeploymentFailure
      duration: "PT2M"
      parameters:
        targetResourceType: "Microsoft.CognitiveServices/accounts/deployments"
        targetResources:
          - ""  # Model Deployment Resource ID
        failureType: "model_unavailable"
        
    - name: ai-services-key-authentication-failure
      type: AIServicesKeyAuthenticationFailure
      duration: "PT2M"
      parameters:
        targetResourceType: "Microsoft.CognitiveServices/accounts"
        targetResources:
          - ""  # AI Services Account Resource ID
        failureType: "key_validation_error"
        
    - name: ai-services-region-failover
      type: AIServicesRegionFailover
      duration: "PT4M"
      parameters:
        targetResourceType: "Microsoft.CognitiveServices/accounts"
        targetResources:
          - ""  # AI Services Account Resource ID
        failoverType: "primary_region_outage"

---
# Azure AI Services Advanced Chaos Scenarios
apiVersion: chaosstudio.io/v1beta1
kind: Experiment
metadata:
  name: ai-services-advanced-chaos
  namespace: chaos-testing
spec:
  steps:
    - name: ai-services-content-moderation-failure
      type: AIServicesContentModerationFailure
      duration: "PT2M"
      parameters:
        targetResourceType: "Microsoft.CognitiveServices/accounts"
        targetResources:
          - ""  # AI Services Account Resource ID
        failureType: "moderation_service_unavailable"
        
    - name: ai-services-speech-to-text-failure
      type: AIServicesSpeechToTextFailure
      duration: "PT3M"
      parameters:
        targetResourceType: "Microsoft.CognitiveServices/accounts"
        targetResources:
          - ""  # AI Services Account Resource ID
        failureType: "speech_recognition_timeout"
        
    - name: ai-services-text-to-speech-failure
      type: AIServicesTextToSpeechFailure
      duration: "PT2M"
      parameters:
        targetResourceType: "Microsoft.CognitiveServices/accounts"
        targetResources:
          - ""  # AI Services Account Resource ID
        failureType: "voice_synthesis_error"
        
    - name: ai-services-translation-failure
      type: AIServicesTranslationFailure
      duration: "PT2M"
      parameters:
        targetResourceType: "Microsoft.CognitiveServices/accounts"
        targetResources:
          - ""  # AI Services Account Resource ID
        failureType: "translation_model_unavailable"

---
# Azure OpenAI Service Chaos
apiVersion: chaosstudio.io/v1beta1
kind: Experiment
metadata:
  name: azure-openai-chaos
  namespace: chaos-testing
spec:
  steps:
    - name: openai-model-failure
      type: OpenAIModelFailure
      duration: "PT3M"
      parameters:
        targetResourceType: "Microsoft.CognitiveServices/accounts/deployments"
        targetResources:
          - ""  # OpenAI Deployment Resource ID
        failureType: "model_overloaded"
        
    - name: openai-token-limit-exceeded
      type: OpenAITokenLimitExceeded
      duration: "PT2M"
      parameters:
        targetResourceType: "Microsoft.CognitiveServices/accounts/deployments"
        targetResources:
          - ""  # OpenAI Deployment Resource ID
        limitType: "context_window_exceeded"
        
    - name: openai-fine-tuning-failure
      type: OpenAIFineTuningFailure
      duration: "PT5M"
      parameters:
        targetResourceType: "Microsoft.CognitiveServices/accounts"
        targetResources:
          - ""  # OpenAI Account Resource ID
        failureType: "training_job_failed"
        
    - name: openai-rag-failure
      type: OpenAIRAGFailure
      duration: "PT3M"
      parameters:
        targetResourceType: "Microsoft.CognitiveServices/accounts"
        targetResources:
          - ""  # OpenAI Account Resource ID
        failureType: "retrieval_timeout"

---
