# Azure Front Door Chaos Experiment Configuration
# Tests Front Door resilience, routing, and WAF capabilities under failure conditions

apiVersion: chaosstudio.io/v1beta1
kind: Experiment
metadata:
  name: front-door-chaos-experiment
  namespace: chaos-testing
spec:
  steps:
    - name: front-door-backend-pool-failure
      type: FrontDoorBackendPoolFailure
      duration: "PT3M"
      parameters:
        targetResourceType: "Microsoft.Network/frontdoors"
        targetResources:
          - ""  # Front Door Resource ID
        backendPoolName: "default-backend-pool"
        failureType: "backend_unavailable"
        
    - name: front-door-routing-rule-failure
      type: FrontDoorRoutingRuleFailure
      duration: "PT2M"
      parameters:
        targetResourceType: "Microsoft.Network/frontdoors"
        targetResources:
          - ""  # Front Door Resource ID
        routingRuleName: "default-routing-rule"
        failureType: "rule_disabled"
        
    - name: front-door-health-probe-failure
      type: FrontDoorHealthProbeFailure
      duration: "PT2M"
      parameters:
        targetResourceType: "Microsoft.Network/frontdoors"
        targetResources:
          - ""  # Front Door Resource ID
        healthProbeName: "default-health-probe"
        failureType: "probe_timeout"
        
    - name: front-door-cdn-failure
      type: FrontDoorCDNFailure
      duration: "PT3M"
      parameters:
        targetResourceType: "Microsoft.Network/frontdoors"
        targetResources:
          - ""  # Front Door Resource ID
        failureType: "cdn_cache_miss"

---
# Azure Front Door Advanced Chaos Scenarios
apiVersion: chaosstudio.io/v1beta1
kind: Experiment
metadata:
  name: front-door-advanced-chaos
  namespace: chaos-testing
spec:
  steps:
    - name: front-door-waf-rule-failure
      type: FrontDoorWAFFailure
      duration: "PT2M"
      parameters:
        targetResourceType: "Microsoft.Network/frontdoors"
        targetResources:
          - ""  # Front Door Resource ID
        wafPolicyName: "default-waf-policy"
        failureType: "rule_evaluation_error"
        
    - name: front-door-geo-routing-failure
      type: FrontDoorGeoRoutingFailure
      duration: "PT3M"
      parameters:
        targetResourceType: "Microsoft.Network/frontdoors"
        targetResources:
          - ""  # Front Door Resource ID
        failureType: "geo_location_mismatch"
        
    - name: front-door-ssl-certificate-failure
      type: FrontDoorSSLCertificateFailure
      duration: "PT2M"
      parameters:
        targetResourceType: "Microsoft.Network/frontdoors"
        targetResources:
          - ""  # Front Door Resource ID
        failureType: "certificate_validation_error"
        
    - name: front-door-compression-failure
      type: FrontDoorCompressionFailure
      duration: "PT2M"
      parameters:
        targetResourceType: "Microsoft.Network/frontdoors"
        targetResources:
          - ""  # Front Door Resource ID
        failureType: "compression_disabled"

